<div class="row">
    <div class="col-12">
        <nb-card class="card-auto-height mb-3">
            <nb-card-header>Blog</nb-card-header>
            <nb-card-body>
                <div class="row align-items-center">
                    <div class="col-12 col-lg-6">
                        <div class="input-group mb-3 mb-lg-0">
                            <input 
                                [(ngModel)]="query"
                                autocomplete="off"
                                type="text" 
                                nbInput 
                                placeholder="Buscar por titulo o etiqueta..." 
                                fullWidth 
                                class="col border-right-0">
                            <div class="input-group-append">
                                <button nbButton outline status="info" class="btn btn-outline-info" type="button" id="button-addon2">
                                    <nb-icon icon="search-outline"></nb-icon>
                                </button>
                            </div>
                        </div>
                    </div>
                    <div class="col-12 col-lg-6 text-right">
                        <button nbButton status="success" class="col-12 col-lg-auto btn btn-success" data-toggle="modal"
                            [attr.data-target]="'#'+ID_FORM" (click)='MODE=ACTION.CREATE'>Registrar</button>
                    </div>
                </div>
            </nb-card-body>
        </nb-card>
    </div>
</div>

<!-- El filtro se aplica a todos los posts antes de paginar; el paginador vuelve a la página 1 al cambiar la búsqueda -->
<ng-container *ngIf="(data$ | async | search: query) as filteredPosts">
    <div class="columm-post">
        <div class="card-post" *ngFor="let item of pageOfItems">
            <app-blog-card 
                (edit)="onEditPost($event)"
                (delete)="onDeletePost($event)"
                [data]="item"></app-blog-card>
        </div>
    </div>

    <nb-card class="card-auto-height" *ngIf="filteredPosts.length === 0">
        <nb-card-body class="fadeIn">
            <nb-alert status="warning" class="mb-0">No hay registro de posts.</nb-alert>
        </nb-card-body>
    </nb-card>

    <nb-card class="card-auto-height" [ngClass]="{'d-none': filteredPosts.length <= 10}">
        <nb-card-body class="d-flex justify-content-center">
            <app-paginator 
                [initialPage]="1"
                [maxPages]="5"
                [pageSize]="10"
                [items]="filteredPosts"
                (changePage)="onChangePage($event)"></app-paginator>
        </nb-card-body>
    </nb-card>
</ng-container>

<app-blog-form 
    (edit)="onEditPostForm($event)"
    (register)="onRegisterPost($event)"
    [DATA]="postSelected"
    [ID]="ID_FORM" 
    [MODE]="MODE"></app-blog-form>
