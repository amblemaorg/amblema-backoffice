<nb-card>
  <nb-card-header>Subir compendio</nb-card-header>
  <nb-card-body>
    <form [formGroup]="form" (ngSubmit)="submit(fileInput)" class="upload-form">
      <div class="field">
        <label for="vademecum-sheet-type" class="label">Tipo de ficha</label>
        <nb-select
          id="vademecum-sheet-type"
          formControlName="sheetTypeId"
          placeholder="Seleccione el tipo"
          fullWidth
        >
          <nb-option *ngFor="let type of sheetTypes" [value]="type.id">
            <span class="type-dot" [style.background]="type.color"></span>
            {{ type.name }} ({{ type.codePrefix }})
          </nb-option>
        </nb-select>
        <small
          *ngIf="form.get('sheetTypeId').touched && form.get('sheetTypeId').invalid"
          class="text-danger"
          >Seleccione el tipo de ficha.</small
        >
      </div>

      <div class="field" *ngIf="series.length">
        <label for="vademecum-series" class="label">Serie (segmentación por grados)</label>
        <nb-select
          id="vademecum-series"
          formControlName="seriesId"
          placeholder="Seleccione la serie"
          fullWidth
        >
          <nb-option *ngFor="let item of series" [value]="item.id">
            {{ item.name }} · código {{ selectedType?.codePrefix }}{{ item.code }}
          </nb-option>
        </nb-select>
        <small
          *ngIf="form.get('seriesId').touched && form.get('seriesId').invalid"
          class="text-danger"
          >Este tipo tiene series: seleccione una.</small
        >
      </div>

      <div class="field">
        <label for="vademecum-file" class="label">Compendio en PDF (máx. {{ maxUploadMb }} MB)</label>
        <input
          #fileInput
          id="vademecum-file"
          type="file"
          accept="application/pdf,.pdf"
          class="form-control-file"
          [disabled]="uploading"
          (change)="onFileChange($event)"
        />
        <small *ngIf="fileError" class="text-danger d-block">{{ fileError }}</small>
      </div>

      <div *ngIf="uploading" class="field">
        <nb-progress-bar [value]="progress" status="primary" [displayValue]="true"></nb-progress-bar>
        <small class="text-hint">Subiendo el archivo…</small>
      </div>

      <button nbButton status="primary" type="submit" [disabled]="uploading || !file">
        Subir y procesar
      </button>
    </form>
  </nb-card-body>
</nb-card>
