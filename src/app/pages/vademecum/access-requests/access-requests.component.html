<nb-card>
  <nb-card-header>Solicitudes de acceso a Vademécum</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-12 form-group">
        <label class="label">Estado:</label>
        <nb-radio-group [(ngModel)]="status" class="d-flex" (valueChange)="onStatusChange()">
          <nb-radio value="pending">Pendientes</nb-radio>
          <nb-radio value="approved">Aprobadas</nb-radio>
          <nb-radio value="rejected">Rechazadas</nb-radio>
        </nb-radio-group>
      </div>
      <div class="col-12 col-md-6 form-group">
        <label class="label">Buscar:</label>
        <input nbInput fullWidth placeholder="Nombre, correo o cédula" [(ngModel)]="query" (ngModelChange)="onSearch()" />
      </div>
      <div class="col-12 col-md-6 form-group">
        <label class="label">Año escolar:</label>
        <select class="form-control" [(ngModel)]="requestsYearId" (change)="onFilterChange()">
          <option [ngValue]="null">Todos</option>
          <option *ngFor="let year of schoolYears" [ngValue]="year.id">{{ year.name }}</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <ng2-smart-table *ngIf="requestsSource" [source]="requestsSource" [settings]="requestsSettings"
        (custom)="onRequestAction($event)"></ng2-smart-table>
    </div>
  </nb-card-body>
</nb-card>

<nb-card>
  <nb-card-header>Autorizaciones del año</nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-12 col-md-6 form-group">
        <label class="label">Año escolar:</label>
        <select class="form-control" [(ngModel)]="authYearId" (change)="onAuthYearChange()">
          <option [ngValue]="null">Año vigente</option>
          <option *ngFor="let year of schoolYears" [ngValue]="year.id">{{ year.name }}</option>
        </select>
      </div>
    </div>

    <div class="table-responsive">
      <ng2-smart-table [source]="authSource" [settings]="authSettings" (custom)="onAuthAction($event)"></ng2-smart-table>
    </div>
  </nb-card-body>
</nb-card>

<!-- Rechazo con motivo -->
<app-modal [ID]="rejectFormId" [size]="'normal'"
  [title]="rejecting ? 'Rechazar a ' + fullName(rejecting) : 'Rechazar solicitud'" extra="true">
  <form *ngIf="rejecting" content (ngSubmit)="confirmReject()">
    <label class="label">Motivo del rechazo (obligatorio, se enviará por correo)</label>
    <textarea nbInput fullWidth rows="4" name="rejectReason" [maxlength]="maxReasonLength" [(ngModel)]="rejectReason"
      [disabled]="submitting"></textarea>
    <small class="counter">{{ rejectReason.length }} / {{ maxReasonLength }}</small>
  </form>

  <button nbButton button type="button" status="danger" class="col-6 col-md-auto"
    [disabled]="submitting || !reasonValid" (click)="confirmReject()">
    {{ submitting ? 'Rechazando...' : 'Rechazar' }}
  </button>
</app-modal>
