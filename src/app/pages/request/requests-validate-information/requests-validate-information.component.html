<nb-card>
  <nb-card-header>Validación de información</nb-card-header>
  <nb-card-body>
    <div class="table-responsive">
      <ng2-smart-table
        (custom)="onAction($event)"
        [settings]="settings"
        [source]="source"
      ></ng2-smart-table>
    </div>
  </nb-card-body>
</nb-card>

<!-- Loading overlay: tabla -->
<div *ngIf="loadingTable" class="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p class="loading-text">Cargando solicitudes...</p>
  </div>
</div>

<!-- Loading overlay: ver detalles -->
<div *ngIf="loadingView" class="loading-overlay">
  <div class="loading-box">
    <div class="spinner"></div>
    <p class="loading-text">Cargando solicitud...</p>
  </div>
</div>
