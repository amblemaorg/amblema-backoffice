<nb-card>
  <nb-card-header>
    Reporte de Diagnósticos
  </nb-card-header>
  <nb-card-body>
    <div class="row">
      <div class="col-12">
        <div class="row">
          <div class="col-12">
            <h6>Configuración del Reporte</h6>
            <hr />
          </div>

          <div class="col-12 form-group">
            <label class="label d-block">Tipo de Reporte</label>
            <nb-radio-group [(ngModel)]="reportType" name="reportType" class="d-flex flex-row">
              <nb-radio [value]="'diagnostics'" class="mr-4">Reporte de diagnósticos</nb-radio>
              <nb-radio [value]="'pins'">Reporte de pines</nb-radio>
            </nb-radio-group>
          </div>

          <div class="col-12 col-lg-6 form-group" *ngIf="reportType === 'diagnostics'">
            <label class="label">Escuela</label>
            <ng-select
              *ngIf="schools$ | async"
              [items]="schools$ | async"
              bindLabel="name"
              placeholder="Buscar escuela"
              [(ngModel)]="selectedSchool"
            >
            </ng-select>
          </div>

          <div class="col-12 col-lg-6 form-group" *ngIf="reportType === 'diagnostics'">
            <label class="label d-block">Diagnóstico</label>
            <div class="d-inline">
              <nb-checkbox
                (change)="item.value = !item.value"
                class="mr-4 mb-2"
                status="primary"
                [checked]="item.value"
                *ngFor="let item of diagnostics"
              >
                {{ item.label }}</nb-checkbox
              >
            </div>
          </div>
          <div class="col-12 col-lg-6 form-group">
            <label class="label">Período academico</label>
            <ng-select
              *ngIf="data$ | async"
              [items]="data$ | async"
              bindLabel="name"
              placeholder="Seleccionar el periodo escolar"
              [(ngModel)]="selectedSchoolYears"
            >
            </ng-select>
          </div>
        </div>
      </div>
    </div>
  </nb-card-body>
  <nb-card-footer class="w-100 text-right" *ngIf="reportType === 'diagnostics'">
    <button
      (click)="onGenerateReport()"
      class="col-12 col-lg-auto"
      [nbSpinner]="disabledBtn"
      [attr.disabled]="
        !disabledBtn &&
        selectedSchool &&
        selectedSchoolYears &&
        (diagnostics[0].value || diagnostics[1].value || diagnostics[2].value)
          ? null
          : true
      "
      nbButton
      status="success"
    >
      <span *ngIf="!disabledBtn">Generar reporte </span>
      <span *ngIf="disabledBtn">Generando... </span>
      <nb-icon icon="download-outline"></nb-icon>
    </button>
  </nb-card-footer>
  <nb-card-footer class="w-100 text-right" *ngIf="reportType === 'pins'">
    <button
      (click)="onGeneratePinsReport('pdf')"
      class="col-12 col-lg-auto mr-lg-3 mb-2 mb-lg-0"
      [nbSpinner]="disabledBtn"
      [attr.disabled]="!disabledBtn && selectedSchoolYears ? null : true"
      nbButton
      status="danger"
    >
      <span *ngIf="!disabledBtn">Exportar a PDF </span>
      <span *ngIf="disabledBtn">Generando... </span>
      <nb-icon icon="file-text-outline"></nb-icon>
    </button>
    <button
      (click)="onGeneratePinsReport('xls')"
      class="col-12 col-lg-auto"
      [nbSpinner]="disabledBtn"
      [attr.disabled]="!disabledBtn && selectedSchoolYears ? null : true"
      nbButton
      status="success"
    >
      <span *ngIf="!disabledBtn">Exportar a Excel </span>
      <span *ngIf="disabledBtn">Generando... </span>
      <nb-icon icon="grid-outline"></nb-icon>
    </button>
  </nb-card-footer>
</nb-card>
